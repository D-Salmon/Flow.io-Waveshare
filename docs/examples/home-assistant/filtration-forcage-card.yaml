type: entities
show_header_toggle: false
state_color: true
entities:
  - type: custom:fold-entity-row
    open: false
    head:
      entity: sensor.fio_pl_flt_ovr_state
      name: Filtration · Forçage temporaire
      icon: mdi:hand-back-right-outline
      tap_action:
        action: fire-dom-event
        fold_row: true
    entities:
      - entity: sensor.fio_pl_flt_ovr_remaining
        name: Temps restant
      - entity: number.fio_pl_flt_ovr_min
        name: Durée du prochain forçage
      - entity: button.fio_pl_flt_ovr_on
        name: Forcer la marche
      - entity: button.fio_pl_flt_ovr_off
        name: Forcer l’arrêt
      - entity: button.fio_pl_flt_ovr_release
        name: Terminer le forçage
card_mod:
  style: |
    {% set forced = has_value('sensor.fio_pl_flt_ovr_state') and state_attr('sensor.fio_pl_flt_ovr_state', 'control_mode') == 'forced' %}
    ha-card {
      background: {{ '#FFF2F2' if forced else '#FFFFFF' }};
      color: #1C1C1E;
      border: 1px solid {{ '#F1DCDC' if forced else '#E3E3E8' }};
      border-radius: 22px;
      box-shadow: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --primary-text-color: #1C1C1E;
      --secondary-text-color: #8A8F99;
      --paper-item-icon-color: #8A8F99;
      --primary-color: #168AFF;
    }
    #states { padding: 8px 16px; }
    #states > div { margin: 0; padding: 12px 0; }
    #states > div + div { border-top: 1px solid {{ '#F1DCDC' if forced else '#F0F0F3' }}; }
    .card-header { font-size: 18px; font-weight: 650; padding-bottom: 4px; }
grid_options:
  columns: 12
  rows: auto
